server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html;
    index index.php index.html index.htm;

    # HTTP/2 headers are compressed (HPACK), but once decompressed,
    # Firefox's large cookie/UA string can exceed standard limits.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;
    client_max_body_size 100M;

    # Increase timeouts
    keepalive_timeout 300s;
    send_timeout 300s;
    client_body_timeout 300s;

    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    fastcgi_send_timeout 180s;
    fastcgi_read_timeout 180s;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        # Standard parameters
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        # When Ingress sends HTTP/2 streams, PHP-FPM needs a stable buffer.
        fastcgi_request_buffering on;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 128k;

        # WordPress/WooCommerce depends on these specific params for AJAX.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # This tells WordPress the request is secure even if the Pod is on port 80
        fastcgi_param HTTPS 'on'; 

        # Firefox sends 'TE: trailers'. In HTTP/2, this header is often forbidden 
        # or restricted. We strip it before it hits PHP to prevent a 400 error.
        fastcgi_param HTTP_TE "";

        fastcgi_read_timeout 300s;  
    }

    # Security
    location ~ /\. { deny all; }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        access_log off;
    }
}
