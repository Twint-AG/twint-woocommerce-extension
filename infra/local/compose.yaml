name: twint-local

x-wp-build: &wp-build
  context: ./docker
  dockerfile: Dockerfile

# Shared bits for both WordPress instances. Each instance still builds its OWN
# vendor/ with its OWN PHP (see per-instance volumes) — a shared vendor cannot be
# correct across two PHP versions.
x-wp-common: &wp-common
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment: &wp-env
    WORDPRESS_DB_HOST: mysql
    WORDPRESS_DB_USER: ${DB_USER}
    WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    WP_ADMIN_USER: ${WP_ADMIN_USER}
    WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
    WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    # Private SDK auth (dev-dev/v9 branch); harmless when unused (packagist SDK).
    COMPOSER_AUTH: '{"http-basic":{"git.nfq.asia":{"username":"${GITLAB_USERNAME}","password":"${GITLAB_TOKEN}"}}}'

services:
  mysql:
    image: mysql:8
    container_name: twint-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3366:3306"
    volumes:
      - db:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wc_latest:
    <<: *wp-common
    build:
      <<: *wp-build
      args:
        # Override in .env (WC_LATEST_IMAGE) to test another PHP, e.g.
        # wordpress:php8.2 / :php8.4. Default 8.3 is the highest PHP that satisfies
        # both the master stable SDK (deps <=8.3) and the dev SDK (deps >=8.3).
        BASE_IMAGE: ${WC_LATEST_IMAGE:-wordpress:php8.3}
    container_name: twint-wc-latest
    ports:
      - "8081:80"
    environment:
      <<: *wp-env
      WORDPRESS_DB_NAME: wc_latest
      WP_URL: http://localhost:8081
      WP_TITLE: TWINT WC latest
      WOO_VERSION: ${WC_LATEST_WOO_VERSION:-}
    volumes:
      - wp_latest:/var/www/html/wp-content
      - ../../:/var/www/html/wp-content/plugins/twint-woocommerce-extension
      - vendor_latest:/var/www/html/wp-content/plugins/twint-woocommerce-extension/vendor
      - node_modules_latest:/var/www/html/wp-content/plugins/twint-woocommerce-extension/node_modules
      - dist_latest:/var/www/html/wp-content/plugins/twint-woocommerce-extension/dist

  wc_oldest:
    <<: *wp-common
    build:
      <<: *wp-build
      args:
        # Override in .env (WC_OLDEST_IMAGE) to test another WP/PHP combo.
        BASE_IMAGE: ${WC_OLDEST_IMAGE:-wordpress:5.9-php8.1}
    container_name: twint-wc-oldest
    ports:
      - "8082:80"
    environment:
      <<: *wp-env
      WORDPRESS_DB_NAME: wc_oldest
      WP_URL: http://localhost:8082
      WP_TITLE: TWINT WC oldest
      WOO_VERSION: ${WC_OLDEST_WOO_VERSION:-}
    volumes:
      - wp_oldest:/var/www/html/wp-content
      - ../../:/var/www/html/wp-content/plugins/twint-woocommerce-extension
      - vendor_oldest:/var/www/html/wp-content/plugins/twint-woocommerce-extension/vendor
      - node_modules_oldest:/var/www/html/wp-content/plugins/twint-woocommerce-extension/node_modules
      - dist_oldest:/var/www/html/wp-content/plugins/twint-woocommerce-extension/dist

volumes:
  db:
  wp_latest:
  wp_oldest:
  vendor_latest:
  vendor_oldest:
  node_modules_latest:
  node_modules_oldest:
  dist_latest:
  dist_oldest:
