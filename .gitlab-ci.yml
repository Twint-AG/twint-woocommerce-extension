image: shivammathur/node:jammy

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"

stages:
  - check
  - archive
  - publish

.base:
  before_script:
    - set -euo pipefail
  tags:
    - d13-runner

# Jobs that run Node. Fails fast if the image ships a Node below the
# October 2026 security floor (22.23.4 / 24.22.1 / 26.12.1).
# Not used by `release`: it runs on an image without Node.
.node-guard:
  extends: .base
  before_script:
    - !reference [.base, before_script]
    - |
      node -e 'const f={22:[23,4],24:[22,1],26:[12,1]};
      const [a,b,c]=process.versions.node.split(".").map(Number);const m=f[a];
      const ok=a>26||!!(m&&(b>m[0]||(b===m[0]&&c>=m[1])));
      console.log("Node "+process.version+(ok?" OK":" is below the security floor"));
      process.exit(ok?0:1)'

tests:
  stage: check
  extends: .node-guard
  only:
    - branches
    - tags
  parallel:
    matrix:
      - PHP_VERSION: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
  script:
    # Update spc (See https://github.com/shivammathur/spc for options)
    - spc -U

    # Setup PHP
    - spc --php-version "$PHP_VERSION" --extensions "bcmath, ctype, curl, dom, fileinfo, filter,gd, hash, iconv, intl, json, libxml, mbstring, openssl, pcre, pdo_mysql, simplexml, soap, sockets, sodium, xsl, tokenizer, xmlwriter, xsl, zlib, libxml"

    # Pick the lock matching the target PHP version (e.g. 8.3 -> composer83.lock)
    - PHP_SUFFIX="${PHP_VERSION//./}"
    - cp "composer${PHP_SUFFIX}.lock" composer.lock

    - composer config --global gitlab-token.git.nfq.asia $GITLAB_ACCESS_TOKEN
    - composer install --no-progress --no-interaction
    - composer outdated --no-dev || true

    # Run coding standard
    - vendor/bin/ecs --no-progress-bar
    - vendor/bin/rector process --dry-run
    - vendor/bin/phpstan analyse --memory-limit=2048M

    - npm install
    - npm outdated --omit=dev || true
    - npx prettier --check ./resources/

build-archive:
  extends: .node-guard
  stage: archive
  only:
    - branches
    - tags
  parallel:
    matrix:
      - PHP_VERSION: [ "8.5" ] # Build on latest PHP version to have access to the latest PHP-scoper
  script:
    - apt-get update && apt-get install -qq zip
    - spc -U
    - spc --php-version "$PHP_VERSION" --extensions "mbstring, curl, dom, fileinfo, gd, iconv, intl, json, xml, mbstring, pdo, phar, zip, sodium, pdo_mysql, bcmath, soap";
    - composer config --global gitlab-token.git.nfq.asia $GITLAB_ACCESS_TOKEN
    - ./bin/archive.sh
  artifacts:
    paths:
      - "build/twint-woocommerce-extension-*.zip"
    expire_in: 1 week

release:
  only:
    - tags
  stage: publish
  image:
    name: alpine/git:latest
    entrypoint: [""]
  extends: .base
  variables:
    GIT_DEPTH: 0
  needs:
    - job: build-archive
      artifacts: true
  script:
    - apk add --no-cache git openssh bash github-cli
    - ./bin/sync.sh